name: Release

# Tag-triggered. Builds Linux binaries, signs the checksum file with cosign (keyless),
# and attaches SLSA provenance (*.intoto.jsonl) to the GitHub release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: read-all

jobs:
  release:
    name: Build, checksum and sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing (OIDC)
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs tag history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Subjects for provenance: the checksum file in "sha256  filename" format, base64-encoded.
      - name: Hash artifacts
        id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # read the workflow run
      id-token: write # sign provenance (OIDC)
      contents: write # upload provenance to the release
    # The SLSA generator verifies its own ref and must be referenced by tag, not by SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: draincheck.intoto.jsonl
      upload-assets: true
