name: Release

# Tag-triggered. Builds the binaries, signs the checksum file with cosign (keyless),
# generates SLSA provenance (*.intoto.jsonl) and publishes the GitHub release.
#
# The release is created as a draft, the provenance is attached to the draft, and only
# then is it published. Repositories with release immutability reject assets added to a
# published release, and a failed run leaves a draft that can simply be deleted.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: read-all

jobs:
  release:
    name: Build, checksum and sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # cosign keyless signing (OIDC)
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tag history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The release notes are the CHANGELOG.md section for the tag. The step fails
      # when the section is missing or empty, before anything is built.
      - name: Extract release notes
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Subjects for provenance: the checksum file in "sha256  filename" format, base64-encoded.
      - name: Hash artifacts
        id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # read the workflow run
      id-token: write # sign provenance (OIDC)
      contents: write # required by the generator workflow; provenance is attached by the publish job
    # The SLSA generator verifies its own ref and must be referenced by tag, not by SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: draincheck.intoto.jsonl
      upload-assets: false # attached to the draft release by the publish job below

  publish:
    name: Attach provenance and publish
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the provenance artifact of this run
      contents: write # upload to and publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download provenance
        run: gh run download "$GITHUB_RUN_ID" --name draincheck.intoto.jsonl --dir provenance

      - name: Check the release is still a draft
        run: |
          set -euo pipefail
          test -s provenance/draincheck.intoto.jsonl
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "Release $TAG is not a draft; refusing to modify it." >&2
            exit 1
          fi

      - name: Attach provenance
        run: gh release upload "$TAG" provenance/draincheck.intoto.jsonl

      - name: Publish release
        run: gh release edit "$TAG" --draft=false
