# Cluster for POD_OWNERSHIP.
#
# worker-01:
#   monitoring/agent-x1  DaemonSet-managed                -> DaemonSet
#   kube-system/etcd-worker-01  mirror pod of a static pod -> StaticPod
#   tools/debug          no controller                    -> Unmanaged
#   shop/web-0           Deployment web via ReplicaSet    -> not reported
#   shop/db-0            StatefulSet                      -> not reported
#   shop/old-0           naked but already Succeeded      -> skipped
#   shop/orphan-0        ReplicaSet missing from snapshot -> not reported
# worker-02:
#   monitoring/agent-x2  DaemonSet-managed                -> DaemonSet
apiVersion: v1
kind: Node
metadata:
  name: worker-01
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-7d4f
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      uid: 11111111-1111-1111-1111-111111111111
      controller: true
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example/web:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-x1
  namespace: monitoring
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 22222222-2222-2222-2222-222222222222
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: agent
      image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-x2
  namespace: monitoring
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 22222222-2222-2222-2222-222222222222
      controller: true
spec:
  nodeName: worker-02
  containers:
    - name: agent
      image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: etcd-worker-01
  namespace: kube-system
  annotations:
    kubernetes.io/config.mirror: 0123456789abcdef
  ownerReferences:
    - apiVersion: v1
      kind: Node
      name: worker-01
      uid: 33333333-3333-3333-3333-333333333333
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: etcd
      image: example/etcd:1
---
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: tools
spec:
  nodeName: worker-01
  containers:
    - name: debug
      image: example/debug:1
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: web-7d4f
      uid: 44444444-4444-4444-4444-444444444444
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: web
      image: example/web:1
---
apiVersion: v1
kind: Pod
metadata:
  name: db-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: db
      uid: 55555555-5555-5555-5555-555555555555
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: db
      image: example/db:1
---
apiVersion: v1
kind: Pod
metadata:
  name: old-0
  namespace: shop
spec:
  nodeName: worker-01
  containers:
    - name: job
      image: example/job:1
status:
  phase: Succeeded
---
apiVersion: v1
kind: Pod
metadata:
  name: orphan-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: gone-1a2b
      uid: 66666666-6666-6666-6666-666666666666
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: app
      image: example/app:1
