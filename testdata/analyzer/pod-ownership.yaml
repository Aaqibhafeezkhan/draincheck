# Cluster for POD_OWNERSHIP.
#
# Expected findings: one per DaemonSet, one per node that runs static pods, and
# one per naked pod.
#
# worker-01:
#   monitoring/agent-x1  DaemonSet monitoring/agent         -> DaemonSet
#   logging/agent-l1     DaemonSet logging/agent (same name, other namespace) -> DaemonSet
#   kube-system/etcd-worker-01  mirror pod of a static pod  -> StaticPod
#   edge/proxy-worker-01        mirror pod, other namespace -> StaticPod
#   tools/debug          no controller                      -> Unmanaged
#   shop/web-0           Deployment web via ReplicaSet      -> not reported
#   shop/db-0            StatefulSet                        -> not reported
#   shop/old-0           naked but already Succeeded        -> skipped
#   shop/orphan-0        ReplicaSet missing from snapshot   -> not reported
# worker-02:
#   monitoring/agent-x2  DaemonSet monitoring/agent         -> DaemonSet
#   kube-system/etcd-worker-02  mirror pod of a static pod  -> StaticPod
#   tools/scratch        no controller                      -> Unmanaged
# worker-03:
#   monitoring/agent-x3  DaemonSet monitoring/agent         -> DaemonSet
apiVersion: v1
kind: Node
metadata:
  name: worker-01
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
---
apiVersion: v1
kind: Node
metadata:
  name: worker-03
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-7d4f
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      uid: 11111111-1111-1111-1111-111111111111
      controller: true
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example/web:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-x1
  namespace: monitoring
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 22222222-2222-2222-2222-222222222222
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: agent
      image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-x2
  namespace: monitoring
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 22222222-2222-2222-2222-222222222222
      controller: true
spec:
  nodeName: worker-02
  containers:
    - name: agent
      image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: etcd-worker-01
  namespace: kube-system
  annotations:
    kubernetes.io/config.mirror: 0123456789abcdef
  ownerReferences:
    - apiVersion: v1
      kind: Node
      name: worker-01
      uid: 33333333-3333-3333-3333-333333333333
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: etcd
      image: example/etcd:1
---
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: tools
spec:
  nodeName: worker-01
  containers:
    - name: debug
      image: example/debug:1
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: web-7d4f
      uid: 44444444-4444-4444-4444-444444444444
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: web
      image: example/web:1
---
apiVersion: v1
kind: Pod
metadata:
  name: db-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: db
      uid: 55555555-5555-5555-5555-555555555555
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: db
      image: example/db:1
---
apiVersion: v1
kind: Pod
metadata:
  name: old-0
  namespace: shop
spec:
  nodeName: worker-01
  containers:
    - name: job
      image: example/job:1
status:
  phase: Succeeded
---
apiVersion: v1
kind: Pod
metadata:
  name: orphan-0
  namespace: shop
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: gone-1a2b
      uid: 66666666-6666-6666-6666-666666666666
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: app
      image: example/app:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-x3
  namespace: monitoring
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 22222222-2222-2222-2222-222222222222
      controller: true
spec:
  nodeName: worker-03
  containers:
    - name: agent
      image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-l1
  namespace: logging
  ownerReferences:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: agent
      uid: 77777777-7777-7777-7777-777777777777
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: agent
      image: example/logagent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: etcd-worker-02
  namespace: kube-system
  annotations:
    kubernetes.io/config.mirror: fedcba9876543210
  ownerReferences:
    - apiVersion: v1
      kind: Node
      name: worker-02
      uid: 88888888-8888-8888-8888-888888888888
      controller: true
spec:
  nodeName: worker-02
  containers:
    - name: etcd
      image: example/etcd:1
---
apiVersion: v1
kind: Pod
metadata:
  name: proxy-worker-01
  namespace: edge
  annotations:
    kubernetes.io/config.mirror: "0011223344556677"
  ownerReferences:
    - apiVersion: v1
      kind: Node
      name: worker-01
      uid: 99999999-9999-9999-9999-999999999999
      controller: true
spec:
  nodeName: worker-01
  containers:
    - name: proxy
      image: example/proxy:1
---
apiVersion: v1
kind: Pod
metadata:
  name: scratch
  namespace: tools
spec:
  nodeName: worker-02
  containers:
    - name: scratch
      image: example/debug:1
