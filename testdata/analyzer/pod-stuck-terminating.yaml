# Cluster for POD_STUCK_TERMINATING. The deadline (deletionTimestamp) is far in
# the past or far in the future, so the fixture does not depend on today's date.
#
# worker-01:
#   shop/held-0      Deployment pod, deadline long past, finalizer     -> finalizer
#   shop/done-0      Deployment pod, Succeeded, deadline long past, finalizer -> finalizer
#   shop/silent-0    Deployment pod, deadline long past, no finalizer  -> no_finalizer
#   shop/leaving-0   Deployment pod, deadline in 2999 (grace period)   -> not reported
#   shop/running-0   not terminating                                   -> not reported
#   logging/agent-1  DaemonSet pod, deadline long past, running       -> skipped by drain
#   logging/agent-done  DaemonSet pod, Succeeded, deadline long past, finalizer -> finalizer (drain waits for it)
# worker-02:
#   shop/other-0     deadline long past                                -> only with worker-02 as target
apiVersion: v1
kind: Node
metadata:
  name: worker-01
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
---
apiVersion: v1
kind: Pod
metadata:
  name: held-0
  namespace: shop
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 30
  finalizers: ["example.com/hold"]
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
---
apiVersion: v1
kind: Pod
metadata:
  name: done-0
  namespace: shop
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 30
  finalizers: ["example.com/hold"]
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
status:
  phase: Succeeded
---
apiVersion: v1
kind: Pod
metadata:
  name: silent-0
  namespace: shop
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 30
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
---
apiVersion: v1
kind: Pod
metadata:
  name: leaving-0
  namespace: shop
  deletionTimestamp: "2999-01-01T00:00:00Z"
  deletionGracePeriodSeconds: 30
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
---
apiVersion: v1
kind: Pod
metadata:
  name: running-0
  namespace: shop
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-1
  namespace: logging
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 30
  ownerReferences:
    - {apiVersion: apps/v1, kind: DaemonSet, name: agent, uid: "22222222-2222-2222-2222-222222222222", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-done
  namespace: logging
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 0
  finalizers: ["example.com/hold"]
  ownerReferences:
    - {apiVersion: apps/v1, kind: DaemonSet, name: agent, uid: "22222222-2222-2222-2222-222222222222", controller: true}
spec:
  nodeName: worker-01
  containers: [{name: c, image: pause}]
status:
  phase: Succeeded
---
apiVersion: v1
kind: Pod
metadata:
  name: other-0
  namespace: shop
  deletionTimestamp: "2020-01-01T00:00:30Z"
  deletionGracePeriodSeconds: 30
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d4f, uid: "11111111-1111-1111-1111-111111111111", controller: true}
spec:
  nodeName: worker-02
  containers: [{name: c, image: pause}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: logging
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers: [{name: c, image: pause}]
