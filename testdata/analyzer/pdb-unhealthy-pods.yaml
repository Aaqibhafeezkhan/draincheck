# Cluster for unhealthyPodEvictionPolicy and the pods that bypass a budget
# (Pending, terminating). Mirrors the eviction handler of kube-apiserver.
#
# A pod that is not Ready can be evicted past its budget: always with the
# policy AlwaysAllow, and with IfHealthyBudget (also when the field is unset)
# while currentHealthy >= desiredHealthy and desiredHealthy > 0. Such an
# eviction does not use up the budget. Pods without a status are healthy: the
# test helper gives them phase Running and Ready=True.
#
# worker-01 .. worker-03 are the targets, worker-04 is not.
#
# mix/mix-pdb        allows 0, healthy budget. mix-0 and mix-1 are Ready, mix-2
#                    is not: BLOCKED for mix-0 and mix-1, mix-2 is let through.
# solo/solo-pdb      allows 0, healthy budget. The only pod on a target is not
#                    Ready: let through, no finding.
# sick/sick-pdb      allows 0, budget unhealthy (1 healthy, 2 desired). sick-0
#                    is not Ready and still cannot be evicted: BLOCKED.
# aa/aa-pdb          AlwaysAllow, budget unhealthy. aa-0 is not Ready: let
#                    through whatever the budget says, no finding.
# odd/odd-pdb        a policy value draincheck does not know: UNKNOWN.
# bypass/bypass-pdb  allows 0. Its pods are Pending and terminating, which
#                    bypass every budget: no finding.
# stale/stale-pdb    AlwaysAllow, but its status is stale. Its numbers cannot be
#                    trusted, so no pod is let through: PDB_STALE_STATUS lists
#                    stale-0 although it is not Ready.
# cnt/cnt-pdb        AlwaysAllow, allows 2, three pods; cnt-2 is not Ready, so
#                    two evictions use the budget and it is not exceeded.
# cnt2/cnt2-pdb      AlwaysAllow, allows 1, three pods; cnt2-2 is not Ready, so
#                    two evictions use the budget and it is exceeded.
