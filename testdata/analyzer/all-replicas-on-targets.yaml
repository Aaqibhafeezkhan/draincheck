  namespace: shop
  labels: {app: web}
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: web-7d9, controller: true}
spec: {nodeName: worker-01}
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
---
