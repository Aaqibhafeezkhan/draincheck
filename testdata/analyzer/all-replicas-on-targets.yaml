# Cluster for ALL_REPLICAS_ON_TARGETS.
#
# A Deployment or StatefulSet with 2 or more desired replicas whose READY pods
# all run on target nodes goes fully down in a batch drain, when no budget makes
# kubectl wait. Three nodes: worker-01, worker-02, worker-03. Pods are Ready
# unless the comment says otherwise.
#
#   shop/web      Deployment, 3 replicas: 2 pods on worker-01, 1 on worker-02
#                 -> reported for [worker-01, worker-02]; not for worker-01 alone
#   shop/api      Deployment, 2 replicas, both on worker-01 -> reported for worker-01
#   shop/starting Deployment, 2 replicas: Ready on worker-01, NOT Ready on worker-03
#                 -> reported for worker-01 (a pod that is not Ready does not carry the load)
#   shop/spread   Deployment, 2 replicas: worker-01 and worker-03 -> not reported for worker-01
#   shop/leaving  Deployment, 2 replicas: worker-01 and a terminating pod on worker-03
#                 -> reported for worker-01 (the terminating pod is going away)
#   shop/single   Deployment, 1 replica on worker-01 -> not reported (SINGLE_REPLICA_WORKLOAD)
#   shop/stuck    Deployment, 2 replicas, both NOT Ready on worker-01 -> not reported (already down)
#   shop/guarded  Deployment, 2 replicas on worker-01, budget minAvailable 1 -> not reported
#                 (kubectl waits on the budget); reported with --disable-eviction
#   shop/open     Deployment, 2 replicas on worker-01, budget desiredHealthy 0 -> reported
#   shop/db       StatefulSet, 2 replicas: db-0 on worker-01, db-1 on worker-02
#                 -> reported for [worker-01, worker-02]
#   shop/batch    Deployment, 2 replicas on worker-01, one pod Succeeded -> the finished pod is ignored,
#                 one Ready pod left on worker-01 and none elsewhere -> reported
#   shop/orphan   Deployment missing from the snapshot -> not reported (replicas unknown)
apiVersion: v1
kind: Node
metadata:
  name: worker-01
status:
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
status:
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: v1
kind: Node
metadata:
  name: worker-03
status:
  conditions:
    - type: Ready
      status: "True"
