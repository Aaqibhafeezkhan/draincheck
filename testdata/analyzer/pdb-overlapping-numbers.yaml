# Cluster for budgets whose numbers cannot be trusted because they overlap
# (#139). The disruption controller picks one budget per pod event, so a budget
# that is not picked keeps the numbers of an earlier sync. Recorded on kind,
# Kubernetes v1.37.0: two budgets with the same selector over two Ready pods,
# dup-a current 2 / allowed 1, dup-b current 0 / allowed 0.
#
# shop/web-0 (worker-01) and shop/web-1 (worker-02) are selected by both dup-a
# and dup-b. dup-a would be a PDB_BATCH_EXCEEDS_BUDGET (2 pods, 1 allowed) and
# dup-b a PDB_DISRUPTION_BLOCKED (allowed 0) if their numbers were read as they
# are; neither is reported, the overlap is.
# shop/cart-0 and shop/cart-1 have one budget at 0: still PDB_DISRUPTION_BLOCKED.
# shop/api-0 and shop/api-1 have one budget that the batch exceeds: still
# PDB_BATCH_EXCEEDS_BUDGET.
# shop/side-0 (worker-01) is selected by side-a and side-b, and shop/side-1
# (worker-02) only by side-a. Draining worker-02 alone evicts side-1, which
# the overlap does not touch, so side-a is read as it is there.
apiVersion: v1
kind: Node
metadata:
  name: worker-01
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
---
apiVersion: v1
kind: Pod
metadata: {name: web-0, namespace: shop, labels: {app: web}}
spec:
  nodeName: worker-01
  containers: [{name: web, image: example/web:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-1, namespace: shop, labels: {app: web}}
spec:
  nodeName: worker-02
  containers: [{name: web, image: example/web:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: cart-0, namespace: shop, labels: {app: cart}}
spec:
  nodeName: worker-01
  containers: [{name: cart, image: example/cart:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: cart-1, namespace: shop, labels: {app: cart}}
spec:
  nodeName: worker-02
  containers: [{name: cart, image: example/cart:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: api-0, namespace: shop, labels: {app: api}}
spec:
  nodeName: worker-01
  containers: [{name: api, image: example/api:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: api-1, namespace: shop, labels: {app: api}}
spec:
  nodeName: worker-02
  containers: [{name: api, image: example/api:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: side-0, namespace: shop, labels: {app: side, tier: extra}}
spec:
  nodeName: worker-01
  containers: [{name: side, image: example/side:1}]
---
apiVersion: v1
kind: Pod
metadata: {name: side-1, namespace: shop, labels: {app: side}}
spec:
  nodeName: worker-02
  containers: [{name: side, image: example/side:1}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dup-a, namespace: shop}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: web}}
status:
  currentHealthy: 2
  desiredHealthy: 1
  disruptionsAllowed: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dup-b, namespace: shop}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: web}}
status:
  currentHealthy: 0
  desiredHealthy: 1
  disruptionsAllowed: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cart-pdb, namespace: shop}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: cart}}
status:
  currentHealthy: 2
  desiredHealthy: 2
  disruptionsAllowed: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api-pdb, namespace: shop}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
status:
  currentHealthy: 2
  desiredHealthy: 1
  disruptionsAllowed: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: side-a, namespace: shop}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: side}}
status:
  currentHealthy: 2
  desiredHealthy: 1
  disruptionsAllowed: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: side-b, namespace: shop}
spec:
  minAvailable: 1
  selector: {matchLabels: {tier: extra}}
status:
  currentHealthy: 1
  desiredHealthy: 1
  disruptionsAllowed: 0
