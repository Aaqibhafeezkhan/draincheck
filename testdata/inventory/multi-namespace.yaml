apiVersion: v1
kind: Node
metadata:
  name: worker-01
---
apiVersion: v1
kind: Node
metadata:
  name: worker-02
---
apiVersion: v1
kind: Pod
metadata:
  name: api-0
  namespace: billing
  labels:
    app: api
spec:
  nodeName: worker-01
  containers:
    - name: api
      image: example/api:1
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: shop
  labels:
    app: web
spec:
  nodeName: worker-02
  containers:
    - name: web
      image: example/web:1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: billing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
